image: python:3.11

stages:
  - lint
  - test

before_script:
  - apt-get update -y
  - apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
  - pip install .[dev,test,lint]

critical_lint:
  stage: lint
  script:
    - pylint --ignore tui.py,gnome.py -E src
  allow_failure: true

ruff:
  stage: lint
  script:
    - ruff check .
  allow_failure: true

pylint:
  stage: lint
  script:
    - pylint src
  allow_failure: true

test:
  stage: test
  script:
    - pytest
