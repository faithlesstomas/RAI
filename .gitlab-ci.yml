image: python:3.11

stages:
  - lint
  - test

before_script:
  - apt-get update && apt-get install -y libgirepository1.0-dev
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install -e .[test,lint]

lint:
  stage: lint
  script:
    - ruff check .
    - pylint src/

test:
  stage: test
  script:
    - pytest
