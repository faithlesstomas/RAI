image: python:3.11

stages:
  - lint
  - test
  - build
  - release
  - test-publish
  - deploy

pages:
  stage: deploy
  script:
    - uv run sphinx-build -W --keep-going -b html docs/ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

before_script:
  - apt-get update -y
  - apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
  - pip install uv
  - uv sync --frozen --extra dev --extra docs

.release_job:
  stage: release
  image: python:3.11
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_COMMIT_AUTHOR: "semantic-release-bot <semantic-release@rai-project.com>"
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

publish_preview:
  extends: .release_job
  script:
    - pip install "python-semantic-release>=10,<11"
    - git config --global user.name "semantic-release-bot"
    - git config --global user.email "semantic-release@rai-project.com"
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
    - semantic-release version --as-prerelease --prerelease-token alpha
    - semantic-release publish

publish_release:
  extends: .release_job
  script:
    - pip install "python-semantic-release>=10,<11"
    - git config --global user.name "semantic-release-bot"
    - git config --global user.email "semantic-release@rai-project.com"
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
    - semantic-release version
    - semantic-release publish
critical_lint:
  stage: lint
  script:
    - uv run pylint -E src/rai

ruff_critical:
  stage: lint
  script:
    - uv run ruff check src tests --select E9,F63,F7,F82

ruff:
  stage: lint
  script:
    - uv run ruff check .
  allow_failure: true

pylint:
  stage: lint
  script:
    - uv run pylint src
  allow_failure: true

test:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  script:
    - uv run pytest --timeout=30 --cov=src/rai --cov-report=term

package:
  stage: build
  script:
    - uv build --out-dir build/pypi
    - uv run twine check build/pypi/*.whl build/pypi/*.tar.gz
    - python -m venv /tmp/rich-ai-wheel-smoke
    - /tmp/rich-ai-wheel-smoke/bin/python -m pip install build/pypi/rich_ai-*.whl
    - /tmp/rich-ai-wheel-smoke/bin/python -c "from importlib.metadata import version; import rai; assert version('rich-ai') == rai.__version__"
    - /tmp/rich-ai-wheel-smoke/bin/rai --version
    - /tmp/rich-ai-wheel-smoke/bin/rai capability list
  artifacts:
    paths:
      - build/pypi/
    expire_in: 30 days

publish_testpypi:
  stage: test-publish
  image: python:3.11
  before_script: []
  needs:
    - job: package
      artifacts: true
  environment:
    name: testpypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: testpypi
  script:
    - python -m pip install "twine>=6,<7"
    - python -m twine upload --repository testpypi build/pypi/*.whl build/pypi/*.tar.gz
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+((a|b|rc)\d+|-(alpha|beta|rc)\.\d+)?$/
      when: manual

publish_pypi:
  stage: deploy
  image: python:3.11
  before_script: []
  needs:
    - job: package
      artifacts: true
    - job: publish_testpypi
  environment:
    name: pypi
    deployment_tier: production
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install "twine>=6,<7"
    - python -m twine upload build/pypi/*.whl build/pypi/*.tar.gz
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+((a|b|rc)\d+|-(alpha|beta|rc)\.\d+)?$/
      when: manual
