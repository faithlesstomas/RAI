image: python:3.11

stages:
  - lint
  - test

before_script:
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install -e .[test,lint]

critical_lint:
  stage: lint
  script:
    # - ruff check .
    - pylint -E src

ruff:
  stage: lint
  script:
    - ruff check .
  allow_failure: true

pylint:
  stage: lint
  script:
    - ruff check .
  allow_failure: true

test:
  stage: test
  script:
    - pytest
