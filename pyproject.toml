[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-cli"
version = "0.1.0"
description = "Rich AI CLI assistant using Agno framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "dotenv",
    "agno",
    "rich",
    "click",
    "ollama",
    "packaging",
    "duckduckgo-search",
    "wikipedia",
    "arxiv",
    "pypdf",
    "tavily-python",
    "textual",
    "prompt_toolkit",
    "sqlalchemy",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
gemini = ["google-generativeai"]
openai = ["openai"]
groq = ["groq"]
test = ["pytest"]
lint = ["ruff", "pylint"]
gnome-tools = ["pydbus", "pygobject"]
all = [
    "rai-cli[anthanthropic]",
    "rai-cli[gemini]",
    "rai-cli[openai]",
    "rai-cli[groq]",
    "rai-cli[gnome-tools]",
]

[project.scripts]
rai = "rai.cli:cli"
rai-tui = "rai.tui:run_tui_cli"

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.ruff.lint]
select = ["PL"]
