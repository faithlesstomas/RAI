[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-cli"
version = "0.1.0"
description = "Rich AI CLI assistant using Agno framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "python-dotenv",
    "agno>=2.0",
    "rich",
    "click",
    "ollama",
    "packaging",
    "textual",
    "prompt_toolkit",
    "sqlalchemy",
    "python-gitlab",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "returns",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
gemini = ["google-generativeai"]
openai = ["openai"]
groq = ["groq"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "agno", "pydantic-ai"]
lint = ["ruff", "pylint"]
dev = ["rai-cli[test]", "rai-cli[lint]"]
gnome-tools = ["pydbus", "pygobject"]
tts = ["piper-tts", "sounddevice", "requests"]
pydantic-ai = ["pydantic-ai"]
tools = [
    "duckduckgo-search",
    "wikipedia",
    "arxiv",
    "pypdf",
    "tavily-python",
    "yfinance",
]
all = [
    "rai-cli[anthropic]",
    "rai-cli[gemini]",
    "rai-cli[openai]",
    "rai-cli[groq]",
    "rai-cli[gnome-tools]",
    "rai-cli[tts]",
    "rai-cli[pydantic-ai]",
    "rai-cli[tools]",
]

[project.scripts]
rai = "rai.cli:cli"
rai-tui = "rai.tui:run_tui_cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"


[tool.ruff.lint]
select = ["PL", "ANN"]


[tool.pylint]
max-line-length=108

[tool.pylint.typing]
