[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai"
version = "0.3.0"
description = "Rich AI - A Local-First Agent Runtime for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "python-dotenv",
    "google-antigravity",
    "protobuf>=5.30.0",
    "rich",
    "click>=8.1,<8.3",
    "ollama",
    "packaging",
    "textual",
    "prompt_toolkit",
    "sqlalchemy",
    "python-gitlab",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "mcp>=1.19,<2",
    "returns",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
gemini = ["google-genai"]
openai = ["openai"]
groq = ["groq"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-timeout"]
lint = ["ruff", "pylint"]
dev = ["rai[test]", "rai[lint]", "rai[tools]"]
gnome-tools = ["pydbus", "pygobject"]
tts = ["piper-tts", "sounddevice", "requests"]
docs = ["sphinx", "myst-parser", "furo", "sphinx-autobuild"]
tools = [
    "duckduckgo-search",
    "wikipedia",
    "arxiv",
    "pypdf",
    "tavily-python",
    "yfinance",
]
inference-llama = ["llama-cpp-python>=0.3.16"]
inference-iree = ["iree-base-compiler>=3.9.0", "iree-base-runtime>=3.9.0"]
inference-onnx = ["onnx>=1.20.1", "onnxruntime>=1.23.2"]
inference-transformers = [
    "tokenizers>=0.22.1",
    "transformers>=5.5",
    "torch>=2.9.1",
    "accelerate>=1.12.0",
    "safetensors>=0.6.2",
]
inference-jlens = [
    "accelerate>=1.12.0",
    "safetensors>=0.6.2",
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]
all = [
    "rai[anthropic]",
    "rai[gemini]",
    "rai[openai]",
    "rai[groq]",
    "rai[gnome-tools]",
    "rai[tts]",
    "rai[tools]",
    "rai[inference-llama]",
    "rai[inference-iree]",
    "rai[inference-onnx]",
    "rai[inference-transformers]",
    "rai[inference-jlens]",
]

[project.scripts]
rai = "rai.cli:cli"
# rai-tui = "rai.tui:run_tui_cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30


[tool.ruff.lint]
select = ["PL", "ANN"]


[tool.pylint]
max-line-length=108

[tool.pylint.typing]

[tool.semantic_release]
tag_format = "v{version}"
version_variables = ["src/rai/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
build_command = "pip install build && python -m build"

[tool.semantic_release.changelog]
template_dir = "templates"
exclude_commit_patterns = []

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "gitlab"

[tool.semantic_release.publish]
upload_to_vcs_release = true
