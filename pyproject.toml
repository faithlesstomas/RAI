[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-ai"
version = "0.4.0-alpha.1"
description = "A secure, local-first integration layer between AI assistants and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "RAI contributors"},
]
keywords = ["ai-agents", "linux", "local-ai", "mcp", "privacy", "runtime", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "python-dotenv",
    "rich",
    "click>=8.1,<8.3",
    "ollama",
    "packaging",
    "textual",
    "prompt_toolkit",
    "sqlalchemy",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "mcp>=1.19,<2",
    "returns",
]

[project.urls]
Homepage = "https://tk-lab1.gitlab.io/ai/rai/"
Documentation = "https://tk-lab1.gitlab.io/ai/rai/"
Repository = "https://gitlab.com/tk-lab1/ai/rai"
Issues = "https://gitlab.com/tk-lab1/ai/rai/-/issues"
Changelog = "https://gitlab.com/tk-lab1/ai/rai/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic"]
gemini = ["google-genai"]
openai = ["openai"]
groq = ["groq"]
antigravity = ["google-antigravity>=0.1.16,<0.2", "protobuf>=5.30.0"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-timeout"]
lint = ["ruff", "pylint"]
dev = [
    "rich-ai[antigravity]",
    "rich-ai[test]",
    "rich-ai[lint]",
    "rich-ai[release]",
    "rich-ai[tools]",
]
gnome-tools = ["pydbus", "pygobject"]
tts = ["piper-tts", "sounddevice", "requests"]
docs = ["sphinx", "myst-parser", "furo", "sphinx-autobuild"]
release = ["build", "twine>=6,<7"]
tools = [
    "python-gitlab",
    "duckduckgo-search",
    "wikipedia",
    "arxiv",
    "pypdf",
    "tavily-python",
    "yfinance",
]
inference-llama = ["llama-cpp-python>=0.3.16"]
inference-iree = ["iree-base-compiler>=3.9.0", "iree-base-runtime>=3.9.0"]
inference-onnx = ["onnx>=1.20.1", "onnxruntime>=1.23.2"]
inference-transformers = [
    "tokenizers>=0.22.1",
    "transformers>=5.5",
    "torch>=2.9.1",
    "accelerate>=1.12.0",
    "safetensors>=0.6.2",
]
inference-jlens = [
    "rich-ai[inference-transformers]",
    "accelerate>=1.12.0",
    "safetensors>=0.6.2",
]
all = [
    "rich-ai[anthropic]",
    "rich-ai[antigravity]",
    "rich-ai[gemini]",
    "rich-ai[openai]",
    "rich-ai[groq]",
    "rich-ai[gnome-tools]",
    "rich-ai[tts]",
    "rich-ai[tools]",
    "rich-ai[inference-llama]",
    "rich-ai[inference-iree]",
    "rich-ai[inference-onnx]",
    "rich-ai[inference-transformers]",
    "rich-ai[inference-jlens]",
]

[dependency-groups]
# PyPI distributions should not declare direct URL dependencies. This
# development-only group pins the upstream reference implementation used by
# fitting and conformance work until jlens has an index release.
jlens-reference = [
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[project.scripts]
rai = "rai.cli:cli"
# rai-tui = "rai.tui:run_tui_cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30


[tool.ruff.lint]
select = ["PL", "ANN"]


[tool.pylint]
max-line-length=108

[tool.pylint.typing]

[tool.semantic_release]
tag_format = "v{version}"
version_variables = ["src/rai/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
build_command = "python -m pip install 'build>=1,<2' && python -m build --sdist --wheel --outdir build/pypi ."

[tool.semantic_release.changelog]
template_dir = "templates"
exclude_commit_patterns = []

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "gitlab"

[tool.semantic_release.publish]
dist_glob_patterns = ["build/pypi/*.whl", "build/pypi/*.tar.gz"]
upload_to_vcs_release = true
